name: geoconverter

services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env}
    restart: unless-stopped
    environment:
      PROJ_NETWORK: "ON"
      UPLOAD_DIR: /app/uploads
      UPLOAD_RETENTION_SEC: "3600"
    volumes:
      - type: bind
        source: /opt/hosting-data/geoconverter/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      edge:
        aliases: [geoconverter-backend]

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      edge:
        aliases: [geoconverter-frontend]

networks:
  edge:
    external: true
    name: hosting_geoconverter_edge
