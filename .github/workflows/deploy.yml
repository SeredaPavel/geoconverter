name: Build and deploy GeoConverter

on:
  push:
    branches: [main, dev, infra/ghcr-hosting]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the main branch to the VPS after both builds pass"
        type: boolean
        default: false

concurrency:
  group: geoconverter-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}:sha-${GITHUB_SHA}"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Build image on GitHub runner
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" "$SERVICE"

      - name: Check image starts and responds
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$SERVICE" = backend ]; then
            port=8000
            endpoint=/api/health
          else
            port=3000
            endpoint=/
          fi
          docker run -d --name smoke -p "127.0.0.1:18080:${port}" "$IMAGE"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "http://127.0.0.1:18080${endpoint}" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs smoke
            exit 1
          fi
          if [ "$SERVICE" = backend ]; then
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:18080/api/crs > /dev/null
          else
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:18080/templates/template_latlon.xlsx > /dev/null
          fi

      - name: Publish checked image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup test container and credentials
        if: always()
        run: |
          docker rm -f smoke 2>/dev/null || true
          docker logout ghcr.io || true

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: geoconverter-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.GEOCONVERTER_VPS_HOST }}
      DEPLOY_KEY: ${{ secrets.GEOCONVERTER_VPS_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.GEOCONVERTER_VPS_KNOWN_HOSTS }}
    steps:
      - name: Deploy through the restricted SSH key
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          task_ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$task_ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          chmod 600 "$task_ssh_dir/key" "$task_ssh_dir/known_hosts"
          ssh -i "$task_ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$task_ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
