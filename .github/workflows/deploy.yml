name: deploy

on:
  push:
    branches: ["main"]

concurrency:
  group: geoconverter-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST:    ${{ secrets.VPS_HOST }}
      VPS_USER:    ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH:    ${{ secrets.VPS_PATH || '/opt/geoconverter' }}
      VPS_PORT:    ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace tree
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la
          echo "Top-level:"
          find . -maxdepth 2 -print

      - name: Sanity check sources exist
        run: |
          set -e
          test -f docker-compose.yml || (echo "No docker-compose.yml at repo root" && exit 1)
          test -f Caddyfile || (echo "No Caddyfile at repo root" && exit 1)
          test -d backend || (echo "No backend/ dir at repo root" && exit 1)
          test -d frontend || (echo "No frontend/ dir at repo root" && exit 1)
          echo "OK: sources present"

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          if [ -n "$VPS_PORT" ] && [ "$VPS_PORT" != "22" ]; then
            ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Prepare directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs: VPS_PATH,VPS_USER
          script: |
            set -e
            VPS_PATH="${VPS_PATH:-/opt/geoconverter}"
            OWNER="${VPS_USER:-$USER}"
            sudo mkdir -p "$VPS_PATH"
            sudo chown "$OWNER:$OWNER" "$VPS_PATH"

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            if ! docker compose version >/dev/null 2>&1; then
              DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
              mkdir -p "$DOCKER_CONFIG/cli-plugins"
              curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-$(uname -s)-$(uname -m)" \
                -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
              chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
            fi

      - name: Sync files to VPS (no git on server)
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          overwrite: true
          rm: true
          debug: true
          # БЕЗ ./ и с /**/*, чтобы точно сматчить файлы
          source: |
            docker-compose.yml
            Caddyfile
            backend/**/*
            frontend/**/*
          target: ${{ env.VPS_PATH }}
          strip_components: 0

      - name: Compose up (build on server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs: VPS_PATH
          script: |
            set -e
            VPS_PATH="${VPS_PATH:-/opt/geoconverter}"
            cd "$VPS_PATH"
            docker compose down || true
            docker compose up -d --build
            docker compose ps
            echo "------ Caddy logs (tail) ------"
            docker logs --tail=50 geoconverter-caddy || true
            echo "------ Frontend health (inside caddy) ------"
            docker exec geoconverter-caddy sh -lc "wget -qO- http://frontend:3000/ | head -c 400 || true"
            echo
