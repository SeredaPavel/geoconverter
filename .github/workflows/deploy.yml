# /.github/workflows/deploy.yml
name: deploy

on:
  push:
    branches: ["main"]
  # по желанию: ручной запуск из вкладки Actions
  workflow_dispatch: {}

concurrency:
  group: geoconverter-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST:    ${{ secrets.VPS_HOST }}
      VPS_USER:    ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH:    ${{ secrets.VPS_PATH || '/opt/geoconverter' }}
      VPS_PORT:    ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace tree
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la
          echo "Top-level:"
          find . -maxdepth 2 -print

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "Adding $VPS_HOST:$VPS_PORT to known_hosts"
          if [ -n "$VPS_PORT" ] && [ "$VPS_PORT" != "22" ]; then
            ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Prepare directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs: VPS_PATH,VPS_USER
          script: |
            set -e
            sudo mkdir -p "$VPS_PATH"
            OWNER="${USER:-$VPS_USER}"
            sudo chown "$OWNER:$OWNER" "$VPS_PATH"
            # docker + compose, если вдруг не стоят
            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi
            if ! docker compose version >/dev/null 2>&1; then
              DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
              mkdir -p "$DOCKER_CONFIG/cli-plugins"
              curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-$(uname -s)-$(uname -m)" \
                -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
              chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
            fi

      - name: Sync files to VPS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          overwrite: true
          rm: true
          debug: true
          # важно: одна строка, элементы через запятую
          source: "docker-compose.yml,Caddyfile,backend/**,frontend/**"
          target: "${{ env.VPS_PATH }}"
          strip_components: 0

      - name: Compose up (build on server, no downtime)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs: VPS_PATH
          script: |
            set -e
            cd "$VPS_PATH"

            # обновляем только нужные сервисы, без остановки caddy
            docker compose up -d --build --no-deps backend
            docker compose up -d --build --no-deps frontend

            # если менялся Caddyfile — "горячо" перечитаем конфиг (без рестарта контейнера)
            docker exec geoconverter-caddy caddy reload --config /etc/caddy/Caddyfile || true

            echo "------ compose ps ------"
            docker compose ps

            echo "------ Backend health ------"
            curl -sS http://localhost:8000/docs | head -c 200 || true

            echo "------ Frontend via Caddy ------"
            curl -sS http://localhost/ | head -c 200 || true

            echo "------ prune old images/cache ------"
            docker image prune -af || true
            docker builder prune -af || true
