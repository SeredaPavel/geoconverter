name: Build GeoConverter images

on:
  push:
    branches: [main, dev, infra/ghcr-hosting]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: geoconverter-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}:sha-${GITHUB_SHA}"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Build image on GitHub runner
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" "$SERVICE"

      - name: Check image starts and responds
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$SERVICE" = backend ]; then
            port=8000
            endpoint=/api/health
          else
            port=3000
            endpoint=/
          fi
          docker run -d --name smoke -p "127.0.0.1:18080:${port}" "$IMAGE"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "http://127.0.0.1:18080${endpoint}" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs smoke
            exit 1
          fi
          if [ "$SERVICE" = backend ]; then
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:18080/api/crs > /dev/null
          else
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:18080/templates/template_latlon.xlsx > /dev/null
          fi

      - name: Publish checked image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup test container and credentials
        if: always()
        run: |
          docker rm -f smoke 2>/dev/null || true
          docker logout ghcr.io || true
