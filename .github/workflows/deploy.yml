name: deploy

on:
  push:
    branches: ["main"]

concurrency:
  group: geoconverter-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST:    ${{ secrets.VPS_HOST }}
      VPS_USER:    ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH:    ${{ secrets.VPS_PATH || '/opt/geoconverter' }}
      VPS_PORT:    ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace tree
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la
          find . -maxdepth 2 -print

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "Adding $VPS_HOST:$VPS_PORT to known_hosts"
          if [ -n "$VPS_PORT" ] && [ "$VPS_PORT" != "22" ]; then
            ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Prepare directory on VPS (and ensure docker/compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs: VPS_PATH,VPS_USER
          script: |
            set -e
            sudo mkdir -p "$VPS_PATH"
            OWNER="${USER:-$VPS_USER}"
            sudo chown "$OWNER:$OWNER" "$VPS_PATH"

            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker "$OWNER" || true
            fi

            if ! docker compose version >/dev/null 2>&1; then
              DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
              mkdir -p "$DOCKER_CONFIG/cli-plugins"
              curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-$(uname -s)-$(uname -m)" \
                -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
              chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
            fi

      # ---- ключевое изменение: собираем единый архив на раннере ----
      - name: Pack deploy artifact
        run: |
          set -e
          test -f docker-compose.yml
          test -f Caddyfile
          test -d backend
          test -d frontend
          tar -czf deploy.tar.gz \
            docker-compose.yml \
            Caddyfile \
            backend \
            frontend
          echo "Artifact size:" && du -h deploy.tar.gz
          echo "Archive contents:" && tar -tzf deploy.tar.gz | head -n 50

      - name: Upload artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          overwrite: true
          rm: false
          debug: true
          source: deploy.tar.gz
          target: ${{ env.VPS_PATH }}
          strip_components: 0

      - name: Unpack & compose up on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs: VPS_PATH
          script: |
            set -e
            cd "$VPS_PATH"
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            docker compose down || true
            docker compose up -d --build
            docker compose ps

            echo "------ Caddy logs (tail) ------"
            docker logs --tail=80 geoconverter-caddy || true
            echo "------ Frontend health through caddy ------"
            docker exec geoconverter-caddy sh -lc "wget -qO- http://frontend:3000/ | head -c 400 || true"
            echo
