
<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9be7ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <style>
      .spin { transform-origin: 100px 100px; animation: spin 12s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
      .title { font: 700 44px/1.1 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: url(#g2); }
      .subtitle { font: 400 14px/1.2 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #64748b;}
    </style>
    <clipPath id="globeClip">
      <circle cx="100" cy="100" r="64"/>
    </clipPath>
  </defs>

  <!-- Glow -->
  <circle cx="100" cy="100" r="78" fill="url(#g1)" opacity="0.12"/>
  <!-- Globe container -->
  <g class="spin">
    <circle cx="100" cy="100" r="64" fill="url(#g1)" stroke="#0ea5e9" stroke-width="1.5"/>
    <g clip-path="url(#globeClip)">
      <!-- Meridians -->
      <g stroke="#0ea5e9" stroke-opacity="0.7" stroke-width="0.8">
        <ellipse cx="100" cy="100" rx="62" ry="24" fill="none"/>
        <ellipse cx="100" cy="100" rx="62" ry="38" fill="none"/>
        <ellipse cx="100" cy="100" rx="62" ry="52" fill="none"/>
        <ellipse cx="100" cy="100" rx="62" ry="62" fill="none"/>
        <line x1="38" y1="100" x2="162" y2="100"/>
      </g>
      <!-- Parallels (rotating) -->
      <g stroke="#0284c7" stroke-opacity="0.6" stroke-width="0.8">
        <line x1="100" y1="38" x2="100" y2="162"/>
        <line x1="70" y1="42" x2="130" y2="158"/>
        <line x1="130" y1="42" x2="70" y2="158"/>
        <line x1="50" y1="60" x2="150" y2="140"/>
        <line x1="150" y1="60" x2="50" y2="140"/>
      </g>
      <!-- Dots (cities) -->
      <g fill="#0369a1">
        <circle cx="130" cy="86" r="2.2"/>
        <circle cx="85" cy="70" r="2.2"/>
        <circle cx="112" cy="128" r="2.2"/>
        <circle cx="65" cy="112" r="2.2"/>
      </g>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(200, 88)">
    <text class="title">ГеоКонвертер</text>
    <text class="subtitle" y="32">Перевод и пересчёт координат • WGS‑84 • СК‑42/95 • ГСК‑2011 • МСК/СК‑63</text>
  </g>
</svg>
